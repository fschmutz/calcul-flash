<?xml version="1.0" encoding="UTF-8"?>
<svg class="logo" viewBox="0 0 260 150" role="img" aria-label="Calcul Flash">
      <defs>
        <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#FF3E8A"/>
          <stop offset="45%" stop-color="#FF8A3D"/>
          <stop offset="100%" stop-color="#FFC93C"/>
        </linearGradient>
        <linearGradient id="gWord" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#3EE7B8"/>
          <stop offset="50%" stop-color="#FFC93C"/>
          <stop offset="100%" stop-color="#FF3E8A"/>
        </linearGradient>
        <linearGradient id="gRing" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"  stop-color="#3EE7B8"/>
          <stop offset="100%" stop-color="#7A5CFF"/>
        </linearGradient>
      </defs>

      <g class="face">
        <circle cx="130" cy="60" r="47" fill="none" stroke="url(#gRing)" stroke-width="3" stroke-dasharray="6 9" opacity=".65"/>
        <circle cx="130" cy="60" r="40" fill="url(#gFace)"/>
        <circle cx="130" cy="60" r="40" fill="none" stroke="#FFF4E8" stroke-width="3" opacity=".9"/>
        <!-- eyes: a plus and a times -->
        <g stroke="#2B0A16" stroke-width="6" stroke-linecap="round">
          <path d="M110 46 v14 M103 53 h14"/>
          <path d="M144 47 l12 12 M156 47 l-12 12"/>
        </g>
        <rect class="lid" x="101" y="44" width="18" height="18" rx="4" fill="url(#gFace)"/>
        <!-- smile -->
        <path d="M107 75 q23 22 46 0" fill="none" stroke="#2B0A16" stroke-width="7" stroke-linecap="round"/>
        <path d="M118 84 q12 9 24 0" fill="#FF3E8A" opacity=".55"/>
        <!-- cheeks -->
        <circle cx="103" cy="72" r="6" fill="#FF3E8A" opacity=".45"/>
        <circle cx="157" cy="72" r="6" fill="#FF3E8A" opacity=".45"/>
      </g>

      <!-- floating operators -->
      <text class="spark" x="62" y="42" font-family="Bungee, Impact, sans-serif" font-size="26" fill="#3EE7B8">÷</text>
      <text class="spark b" x="184" y="34" font-family="Bungee, Impact, sans-serif" font-size="24" fill="#FFC93C">+</text>
      <text class="spark" x="196" y="92" font-family="Bungee, Impact, sans-serif" font-size="22" fill="#FF3E8A">×</text>
      <text class="spark b" x="56" y="96" font-family="Bungee, Impact, sans-serif" font-size="24" fill="#7A5CFF">−</text>

      <text x="130" y="134" text-anchor="middle" font-family="Bungee, Impact, sans-serif" font-size="34"
            fill="url(#gWord)" letter-spacing="1">CALCUL</text>
      <text x="130" y="148" text-anchor="middle" font-family="Fredoka, Trebuchet MS, sans-serif" font-weight="600"
            font-size="12" fill="#9C86D6" letter-spacing="6">F L A S H</text>
    </svg>
